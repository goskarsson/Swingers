<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swingers – Leikmaður</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d1117;
      --surface:    #161b22;
      --surface2:   #1c2128;
      --border:     #30363d;
      --gold:       #d97706;
      --gold-light: #fbbf24;
      --text:       #e6edf3;
      --muted:      #8b949e;
      --eldri:      #818cf8;
      --yngri:      #34d399;
      --green:      #34d399;
      --red:        #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .header-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 60px;
    }
    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .back-link:hover { color: var(--text); }
    .logo {
      width: 32px; height: 32px;
      border-radius: 7px; object-fit: cover;
    }
    .site-title {
      font-size: 1.1rem; font-weight: 800;
      color: var(--gold-light);
    }
    .player-selector {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .player-selector:focus { outline: none; border-color: var(--gold); }

    /* ── Main ── */
    main { max-width: 880px; margin: 0 auto; padding: 24px 20px; }

    /* ── Player hero ── */
    .player-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hero-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold-light);
      flex-shrink: 0;
    }
    .hero-info { flex: 1; min-width: 160px; }
    .hero-nick {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 4px;
    }
    .hero-full {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 600;
    }
    .tag-eldri { background: rgba(129,140,248,.15); color: var(--eldri); }
    .tag-yngri { background: rgba(52,211,153,.15);  color: var(--yngri); }
    .tag-hcp   { background: rgba(251,191,36,.12);  color: var(--gold-light); }

    .hero-stats {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }
    .hstat { text-align: center; }
    .hstat-val { font-size: 1.5rem; font-weight: 800; color: var(--gold-light); line-height: 1; }
    .hstat-lbl { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    .hstat-val.muted-val { color: var(--muted); font-size: 1.1rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* ── Empty 2026 ── */
    .empty {
      text-align: center;
      padding: 44px 20px;
      color: var(--muted);
    }
    .empty h3 { color: var(--text); font-size: 1rem; margin-bottom: 6px; }
    .empty p  { font-size: 0.85rem; }

    /* ── Week rows ── */
    .week-rows { padding: 4px 0; }
    .week-row {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid #21262d;
      gap: 12px;
    }
    .week-row:last-child { border-bottom: none; }
    .week-row.counting { background: rgba(217,119,6,.04); }
    .wr-label {
      font-size: 0.82rem;
      color: var(--muted);
      width: 70px;
      flex-shrink: 0;
    }
    .wr-date {
      font-size: 0.78rem;
      color: var(--muted);
      width: 90px;
      flex-shrink: 0;
    }
    .wr-bar-wrap {
      flex: 1;
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
    }
    .wr-bar {
      height: 100%;
      border-radius: 4px;
      background: var(--gold);
      transition: width 0.4s ease;
    }
    .wr-bar.counting-bar { background: var(--gold-light); }
    .wr-pts {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-light);
      width: 32px;
      text-align: right;
      flex-shrink: 0;
    }
    .wr-star {
      font-size: 0.75rem;
      width: 16px;
      text-align: center;
      color: var(--gold);
      flex-shrink: 0;
    }
    .wr-note {
      font-size: 0.7rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── 2025 summary card ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 1px;
      background: var(--border);
    }
    .sum-cell {
      background: var(--surface);
      padding: 16px;
      text-align: center;
    }
    .sum-val { font-size: 1.3rem; font-weight: 800; color: var(--gold-light); }
    .sum-lbl { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
    .sum-val.rank-val { color: var(--text); }

    /* ── No player state ── */
    .no-player {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .no-player h2 { color: var(--text); font-size: 1.2rem; margin-bottom: 8px; }

    /* ── Par-type comparison ── */
    .par-compare-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
    }
    @media (max-width: 480px) { .par-compare-grid { grid-template-columns: 1fr; } }

    /* Season progression chart */
    .prog-chart { padding: 12px 16px 4px; }
    .prog-legend { display:flex; gap:16px; padding:4px 16px 12px; font-size:0.72rem; color:var(--muted); }
    .prog-legend span { display:flex; align-items:center; gap:5px; }
    .prog-dot-gold { width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--gold-light);flex-shrink:0; }
    .prog-dot-grey { width:9px;height:9px;border-radius:50%;background:#444;border:2px solid #666;flex-shrink:0; }

    /* Hole statistics */
    .hole-grid { display:grid; grid-template-columns:repeat(9,1fr); border-top:1px solid var(--border); }
    @media (max-width:600px) { .hole-grid { grid-template-columns:repeat(6,1fr); } }
    .hole-cell { padding:10px 4px; text-align:center; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
    .hole-cell:nth-child(9n) { border-right:none; }
    .hole-cell.half-break { border-left:2px solid var(--gold); }
    .hc-num  { font-size:0.68rem; color:var(--muted); font-weight:700; margin-bottom:2px; }
    .hc-par  { font-size:0.62rem; color:#555; margin-bottom:4px; }
    .hc-avg  { font-size:0.95rem; font-weight:800; }
    .hc-diff { font-size:0.68rem; margin-top:2px; }
    .hc-best { font-size:0.62rem; color:#555; margin-top:3px; }
    .hc-pos  { color:var(--green); }
    .hc-neg  { color:var(--red); }
    .hc-neu  { color:var(--muted); }
    /* ── Round-by-round hole table (Golf Game Book colors) ── */
    .rnd-wrap { overflow-x:auto; }
    .rnd-table { border-collapse:collapse; width:100%; font-size:0.68rem; }
    .rnd-table th { padding:4px 3px; text-align:center; border:1px solid var(--border);
                    font-size:0.63rem; font-weight:600; background:var(--card-bg);
                    white-space:nowrap; }
    .rnd-table td { padding:3px 2px; text-align:center; border:1px solid var(--border); }
    .rnd-th-lbl  { text-align:left !important; padding:4px 8px !important; min-width:58px; }
    .rnd-td-lbl  { text-align:left; padding:4px 7px; font-weight:600; white-space:nowrap;
                   background:var(--card-bg); }
    .rnd-hdr-sub { display:block; font-size:0.55rem; color:var(--muted); font-weight:400; }
    .rnd-s  { display:block; font-weight:700; font-size:0.7rem; line-height:1.4; }
    .rnd-p  { display:block; font-size:0.58rem; color:var(--muted); }
    /* 0 pts — dark navy (blow-up) */
    .rp0    { background:#0e3460; }
    .rp0 .rnd-s { color:#fff; }
    .rp0 .rnd-p { color:rgba(255,255,255,.55); }
    /* 1 pt — light blue (bogey) */
    .rp1    { background:#bfdbfe; }
    .rp1 .rnd-s { color:#1e3a5f; }
    .rp1 .rnd-p { color:#3b5f8a; }
    /* 2 pts — neutral/white (par) */
    .rp2    { }
    /* 3 pts — red circle (net birdie) */
    .rp3    { }
    .rp3 .rnd-s { display:inline-block; border:2px solid #dc2626; border-radius:50%;
                  width:1.6em; height:1.6em; line-height:1.6em; text-align:center;
                  color:#dc2626; }
    /* 4+ pts — double red circle (net eagle+) */
    .rp4    { }
    .rp4 .rnd-s { display:inline-block;
                  border:2px solid #dc2626;
                  outline:2px solid #dc2626; outline-offset:2px;
                  border-radius:50%;
                  width:1.6em; height:1.6em; line-height:1.6em; text-align:center;
                  color:#dc2626; }
    .rnd-tot{ font-weight:700; background:rgba(75,85,99,.25) !important; }
    .bird-mark { display:block; font-size:9px; line-height:1; margin-top:1px; }
    .hole-section-hdr { grid-column:1/-1; padding:6px 12px; font-size:0.68rem; color:var(--muted);
                        text-transform:uppercase; letter-spacing:.06em; font-weight:700;
                        background:var(--surface2); border-bottom:1px solid var(--border); }
    .pc-cell {
      background: var(--surface);
      padding: 16px 18px;
    }
    .pc-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .pc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.83rem;
    }
    .pc-who { color: var(--muted); width: 52px; flex-shrink: 0; font-size: 0.75rem; }
    .pc-bar-wrap { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .pc-bar { height: 100%; border-radius: 3px; }
    .pc-bar.player-bar { background: var(--gold); }
    .pc-bar.group-bar  { background: var(--muted); opacity: 0.5; }
    .pc-num { font-weight: 700; width: 38px; text-align: right; flex-shrink: 0; }
    .pc-num.better { color: var(--green); }
    .pc-num.worse  { color: var(--red); }
    .pc-num.same   { color: var(--gold-light); }
    .pc-diff { font-size: 0.72rem; color: var(--muted); width: 38px; text-align: right; flex-shrink: 0; }

    /* ── Birdie strip ── */
    .birdie-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 14px 20px;
    }
    .birdie-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .birdie-chip.eagle-chip {
      border-color: rgba(251,191,36,.4);
      background: rgba(217,119,6,.08);
    }
    .bc-wk { color: var(--muted); font-size: 0.7rem; }

    @media (max-width: 580px) {
      main { padding: 12px; }
      .player-hero { padding: 16px; }
      .hero-nick { font-size: 1.3rem; }
      .wr-date { display: none; }
    }
  </style>
</head>

function calcBest8(scores) {
  const vals = Object.values(scores).filter(v => typeof v === 'number').sort((a,b)=>b-a);
  const top  = vals.slice(0, BEST_OF);
  return { best8: top.reduce((t,v)=>t+v,0), rounds: vals.length, topVals: top };
}

function goToPlayer(nick) {
  if (nick) window.location = 'player.html?p=' + encodeURIComponent(nick);
}

  const main = document.getElementById('main-content');
  const nick25 = player.nick25 || player.nick;

  // ── 2026 data ──
  const scores26 = SCORES_2026[player.nick] || {};
  const { best8: b8_26, rounds: r26, topVals: top26 } = calcBest8(scores26);
  const avg26 = r26 > 0 ? (b8_26 / Math.min(r26, BEST_OF)).toFixed(1) : null;

  // ── 2025 data ──
  const scores25 = SCORES_2025[nick25] || {};
  const res25    = RESULTS_2025.find(r => r.nick === nick25);
  const { best8: b8_25, rounds: r25, topVals: top25 } = calcBest8(scores25);

  const initials = player.nick.slice(0,2).toUpperCase();
  const grpClass = player.group.toLowerCase();
  const grpBadge = `<span class="tag tag-${grpClass}">${player.group}</span>`;

  // ── Hero ──
  let heroStats = '';

    heroStats = `

  } else {
    heroStats = `<div class="hstat"><div class="hstat-val muted-val">—</div><div class="hstat-lbl">Engar vikur 2026</div></div>`;
  }
  if (res25) {
    heroStats += `<div class="hstat"><div class="hstat-val">${res25.rank}.</div><div class="hstat-lbl">Sæti 2025</div></div>

  let html = `

    html += `<div class="week-rows">`;
    WEEKS_2026.forEach(w => {

      if (pts === undefined) return;
      const isCounting = topSet.has(pts);
      const barPct = Math.round((pts / maxPts) * 100);
      html += `<div class="week-row ${isCounting?'counting':''}">

      const padT=24, padB=28, padL=8, padR=36;
      const W=520, H=170;
      const iW=W-padL-padR, iH=H-padT-padB;
      const yRange = Math.max(cMax-cMin, 8);
      const xP = i => padL + (chartWeeks.length===1?iW/2:i/(chartWeeks.length-1)*iW);
      const yP = v => padT + (1-(v-(cMin-2))/(yRange+4))*iH;
      const avgY = yP(cAvg);

      // Grid lines every 5 pts
      let gridLines='';
      for (let g=Math.ceil((cMin-2)/5)*5; g<=cMax+2; g+=5) {

    function parAvg(nick, idxArr) {

    birdieEntries.sort((a,b) => (a.score - a.par) - (b.score - b.par));

    function pcCell(label, playerVal, groupVal, parVal) {
      if (playerVal === null) return `<div class="pc-cell"><div class="pc-label">${label}</div><div style="color:var(--muted);font-size:0.8rem">Engin gögn</div></div>`;
      const pStr = playerVal.toFixed(2);
      const gStr = groupVal ? groupVal.toFixed(2) : '—';
      const diff = groupVal ? (playerVal - groupVal) : 0;
      const maxVal = Math.max(playerVal, groupVal || playerVal, parVal) * 1.05;
      const pPct = Math.round((playerVal / maxVal) * 100);
      const gPct = groupVal ? Math.round((groupVal / maxVal) * 100) : 0;
      const diffSign = diff < -0.05 ? 'better' : diff > 0.05 ? 'worse' : 'same';
      const diffStr = diff === 0 || !groupVal ? '' : (diff > 0 ? '+' : '') + diff.toFixed(2);
      return `<div class="pc-cell">
        <div class="pc-label">${label} (par ${parVal})</div>
        <div class="pc-row">
          <span class="pc-who">Þú</span>
          <div class="pc-bar-wrap"><div class="pc-bar player-bar" style="width:${pPct}%"></div></div>
          <span class="pc-num ${diffSign}">${pStr}</span>
          <span class="pc-diff">${diffStr}</span>
        </div>
        <div class="pc-row">
          <span class="pc-who">Hópurinn</span>
          <div class="pc-bar-wrap"><div class="pc-bar group-bar" style="width:${gPct}%"></div></div>
          <span class="pc-num same">${gStr}</span>
          <span class="pc-diff"></span>
        </div>
      </div>`;
    }

    // ── Round-by-round hole table ──────────────────────────────────────────
    {
      let t = '<div class="card"><div class="card-header">📋 Hola fyrir holu — högg og stig</div>';
      t += '<div class="rnd-wrap"><table class="rnd-table"><thead><tr>';
      t += '<th class="rnd-th-lbl">Umferð</th>';
      COURSE_PARS.forEach((par, i) => {
        t += `<th>H${i+1}<span class="rnd-hdr-sub">Par${par}</span></th>`;
      });
      t += '<th class="rnd-tot">Högg</th><th class="rnd-tot">Stig</th></tr></thead><tbody>';
      playerHoleWeeks.forEach(w => {
        const hd = HOLE_DATA[w.id][player.nick];
        const totS = hd.s.reduce((a,b)=>a+b,0);
        const totP = hd.p.reduce((a,b)=>a+b,0);
        t += `<tr><td class="rnd-td-lbl">${w.label}</td>`;
        hd.s.forEach((gross,i) => {
          const pts = hd.p[i];
          const par = COURSE_PARS[i];
          const pc  = pts===0?'rp0':pts===1?'rp1':pts===2?'rp2':pts===3?'rp3':'rp4';
          const bird = gross<=par-2 ? '<span class="bird-mark">🦅</span>'
                     : gross===par-1 ? '<span class="bird-mark">🐦</span>' : '';
          t += `<td class="${pc}"><span class="rnd-s">${gross}</span><span class="rnd-p">${pts}p</span>${bird}</td>`;
        });
        t += `<td class="rnd-tot">${totS}</td><td class="rnd-tot">${totP}</td></tr>`;
      });
      t += '</tbody></table></div></div>';
      html += t;
    }

    html += `<div class="card">
      <div class="card-header">📐 Högg að meðaltali eftir par-tegund — vs hópurinn</div>
      <div class="par-compare-grid">
        ${pcCell('Par 3', p3player, p3group, 3)}
        ${pcCell('Par 4', p4player, p4group, 4)}
        ${pcCell('Par 5', p5player, p5group, 5)}
      </div>
    </div>`;

    // ── Hole statistics ──
    {
      const holeStats = COURSE_PARS.map((par, i) => {
        const scores = [];
        playerHoleWeeks.forEach(w => {
          const hd = (HOLE_DATA[w.id]||{})[player.nick];
          if (hd && hd.s) scores.push(hd.s[i]);
        });
        if (!scores.length) return null;
        const avg   = scores.reduce((a,b)=>a+b,0)/scores.length;
        const vspar = avg - par;
        const best  = Math.min(...scores);
        return { hole:i+1, par, avg, vspar, best, n:scores.length };
      }).filter(Boolean);

      if (holeStats.length) {
        function hCell(hs) {
          const cls  = hs.vspar < -0.15 ? 'hc-pos' : hs.vspar > 0.15 ? 'hc-neg' : 'hc-neu';
          const sign = hs.vspar > 0 ? '+' : '';
          return `<div class="hole-cell">` +
            `<div class="hc-num">H${hs.hole}</div>` +
            `<div class="hc-par">p${hs.par}</div>` +
            `<div class="hc-avg ${cls}">${hs.avg.toFixed(1)}</div>` +
            `<div class="hc-diff ${cls}">${sign}${hs.vspar.toFixed(1)}</div>` +
            `<div class="hc-best">${hs.best}</div></div>`;
        }
        const front9 = holeStats.filter(h => h.hole <= 9).map(hCell).join('');
        const back9  = holeStats.filter(h => h.hole >= 10).map(hCell).join('');
        html += '<div class="card">' +
          '<div class="card-header">⛳ Holutölfræði — ' + HOME_COURSE + '</div>' +
          '<div style="padding:10px 16px 4px;font-size:0.75rem;color:var(--muted)">' +
            'Liti: <span style="color:var(--green)">betra en par</span> · ' +
            '<span style="color:var(--red)">verra en par</span> · neðst: besta högg' +
          '</div>' +
          '<div class="hole-grid">' +
            '<div class="hole-section-hdr">Fyrri 9</div>' + front9 +
            '<div class="hole-section-hdr">Seinni 9</div>' + back9 +
          '</div></div>';
      }
    }

    if (birdieEntries.length > 0) {
      const chips = birdieEntries.map(e => {
        const label = e.isEagle ? `🦅 Örn — H${e.hole}` : `🐦 Fugl — H${e.hole}`;
        return `<div class="birdie-chip ${e.isEagle?'eagle-chip':''}">
          <span>${label}</span>
          <span class="bc-wk">${e.wkLabel}</span>
        </div>`;
      }).join('');
      html += `<div class="card">
        <div class="card-header">🦅 Fuglar og ernir</div>
        <div class="birdie-strip">${chips}</div>
      </div>`;
    }
  }

  // ── Season divider ──
  html += `<div style="
    margin: 28px 0 20px;
    padding: 14px 20px 12px;
    background: linear-gradient(135deg, rgba(217,119,6,.12), rgba(217,119,6,.04));
    border-top: 2px solid var(--gold);
    border-bottom: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  ">
    <div style="font-size: 1.05rem; font-weight: 700; color: var(--gold-light); letter-spacing: 0.06em;">2025 TÍMABILIÐ</div>
    <div style="font-size: 0.75rem; color: var(--muted); margin-top: 3px;">Lokastaða og tölfræði</div>
  </div>`;

  // ── 2025 summary card ──
  if (res25 || r25 > 0) {
    const official25 = res25 || { best8: b8_25, avg: null, rounds: r25, rank: '—' };
    html += `<div class="card">
      <div class="card-header">📊 2025 Tímabilið — Lokastaða</div>
      <div class="summary-grid">
        <div class="sum-cell"><div class="sum-val rank-val">${official25.rank}${typeof official25.rank==='number'?'.':''}</div><div class="sum-lbl">Sæti</div></div>
        <div class="sum-cell"><div class="sum-val">${official25.best8}</div><div class="sum-lbl">Bestu 8 stig</div></div>
        <div class="sum-cell"><div class="sum-val">${official25.avg ? official25.avg.toFixed(1) : '—'}</div><div class="sum-lbl">Meðaltal</div></div>
        <div class="sum-cell"><div class="sum-val">${official25.rounds}</div><div class="sum-lbl">Vikur</div></div>
        <div class="sum-cell"><div class="sum-val">${player.hcp25}</div><div class="sum-lbl">HCP 2025</div></div>
      </div>
    </div>`;

    if (r25 > 0) {
      const maxPts25 = Math.max(...Object.values(scores25).filter(v=>typeof v==='number'), 1);
      const sortedVals25 = Object.values(scores25).filter(v=>typeof v==='number').sort((a,b)=>b-a);
      const cutoff25 = sortedVals25[BEST_OF - 1] ?? 0;

      html += `<div class="card">
        <div class="card-header">📅 2025 Vika fyrir viku</div>
        <div class="week-rows">`;
      WEEKS_2025.forEach(w => {
        const pts = scores25[w.id];
        if (pts === undefined) return;
        const isCounting = pts >= cutoff25 && sortedVals25.indexOf(pts) < BEST_OF;
        const barPct = Math.round((pts / maxPts25) * 100);
        html += `<div class="week-row ${isCounting?'counting':''}">
          <span class="wr-label">${w.label}</span>
          <span class="wr-date">${w.date}</span>
          <div class="wr-bar-wrap"><div class="wr-bar ${isCounting?'counting-bar':''}" style="width:${barPct}%"></div></div>
          <span class="wr-pts">${pts}</span>
          <span class="wr-star">${isCounting?'★':''}</span>
          ${w.note ? `<span class="wr-note">✈</span>` : ''}
        </div>`;
      });
      html += `</div>
        <div style="padding:10px 20px;font-size:0.78rem;color:var(--muted)">★ = taldi í bestu 8</div>
      </div>`;
    }
  } else {
    html += `<div class="card"><div class="card-header">📊 2025 Tímabilið</div>
      <div class="empty"><h3>Enginn þátttaka 2025</h3><p>Þessi leikmaður tók ekki þátt í 2025 tímabilinu.</p></div>
    </div>`;
  }

  main.innerHTML = html;
}

// ============================================================
// 🚀  INIT
// ============================================================
const sel = document.getElementById('player-sel');
PLAYERS.slice().sort((a,b) => a.nick.localeCompare(b.nick, 'is')).forEach(p => {
  const opt = document.createElement('option');
  opt.value = p.nick;
  opt.textContent = p.nick + ' — ' + p.full;
  sel.appendChild(opt);
});

const urlNick = new URLSearchParams(window.location.search).get('p');
if (urlNick) {
  const player = PLAYERS.find(p => p.nick.toLowerCase() === urlNick.toLowerCase());
  if (player) {
    sel.value = player.nick;
    renderPlayer(player);
  } else {
    document.getElementById('main-content').innerHTML =
      `<div class="no-player"><h2>Leikma\xf0ur ekki fundinn: "${urlNick}"</h2><p>Athuga\xf0u stafsetningu e\xf0a veldu leikmann \xfa fellivalmyndinni.</p></div>`;
  }
} else {
  document.getElementById('main-content').innerHTML =
    `<div class="no-player"><h2>Veldu leikmann</h2><p>Nota\xf0u fellivalmyndina h\xe9r a\xf0 ofan.</p></div>`;
}
</script>
</body>
</html>
