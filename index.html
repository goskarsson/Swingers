<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swingers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface2:     #1c2128;
      --border:       #30363d;
      --gold:         #d97706;
      --gold-light:   #fbbf24;
      --text:         #e6edf3;
      --muted:        #8b949e;
      --eldri:        #818cf8;
      --yngri:        #34d399;
      --green:        #34d399;
      --red:          #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 60px;
    }
    .logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }
    .site-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: 0.04em;
    }
    .season-tabs {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
      font-weight: 700;
    }
    .tab-btn:hover:not(.active) { border-color: var(--muted); color: var(--text); }

    /* ── Main ── */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .season-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .meta-item { font-size: 0.82rem; color: var(--muted); }
    .meta-item strong { color: var(--gold-light); }

    /* ── Standings table ── */
    .standings-table {
      width: 100%;
      border-collapse: collapse;
    }
    .standings-table th {
      padding: 9px 16px;
      text-align: left;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .standings-table th.r { text-align: right; }
    .standings-table td {
      padding: 11px 16px;
      border-bottom: 1px solid #21262d;
      font-size: 0.9rem;
      vertical-align: middle;
    }
    .standings-table tr:last-child td { border-bottom: none; }
    .standings-table tbody tr:hover td { background: #1c2128; }
    .td-r { text-align: right; }

    .rank { color: var(--muted); font-size: 0.82rem; width: 32px; }
    .rank.podium { color: var(--gold-light); font-weight: 800; }
    .player-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    .player-link:hover { color: var(--gold-light); }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 7px;
      font-weight: 700;
      vertical-align: middle;
    }
    .badge-eldri { background: rgba(129,140,248,.15); color: var(--eldri); }
    .badge-yngri { background: rgba(52,211,153,.15);  color: var(--yngri); }
    .pts { font-weight: 800; color: var(--gold-light); }
    .gap { color: var(--muted); font-size: 0.82rem; }
    .count { color: var(--muted); }

    /* ── Weeks grid ── */
    .weeks-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 14px 20px;
    }
    .week-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.13s;
      white-space: nowrap;
    }
    .week-btn.has-data { border-color: rgba(217,119,6,.5); color: var(--text); }
    .week-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
      font-weight: 700;
    }
    .week-btn:hover:not(.active) { border-color: var(--muted); }

    /* ── Week detail ── */
    .week-detail {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
    }
    .wk-hdr {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .wk-hdr h3 { font-size: 0.98rem; font-weight: 700; }
    .wk-date { font-size: 0.8rem; color: var(--muted); }
    .wk-note {
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 10px;
      background: rgba(217,119,6,.12);
      color: var(--gold);
      font-weight: 600;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 8px;
    }
    .result-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-card.winner {
      border-color: var(--gold);
      background: rgba(217,119,6,.06);
    }
    .rc-name { font-size: 0.88rem; font-weight: 600; }
    .rc-pos  { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
    .rc-pts  { font-size: 1.05rem; font-weight: 800; color: var(--gold-light); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 56px 20px;
      color: var(--muted);
    }
    .empty h3 { color: var(--text); font-size: 1.05rem; margin-bottom: 8px; }
    .empty p  { font-size: 0.88rem; line-height: 1.6; }

    @media (max-width: 580px) {
      .header-inner { flex-wrap: wrap; height: auto; padding: 10px 0; gap: 10px; }
      .season-tabs  { margin-left: 0; }
      main { padding: 12px; }
      .standings-table td, .standings-table th { padding: 9px 10px; }
    }
  </style>
</head>

// ============================================================
// 🔧  HJÁLPARFÖLL
// ============================================================
function calcStandings(scores, players) {
  return players.map(p => {
    const s = scores[p.nick] || {};
    const vals = Object.values(s).filter(v => typeof v === 'number').sort((a,b)=>b-a);
    const best8 = vals.slice(0, BEST_OF).reduce((t,v)=>t+v, 0);
    return { ...p, rounds: vals.length, best8, avg: vals.length ? (best8 / Math.min(vals.length, BEST_OF)).toFixed(1) : null };
  }).sort((a,b) => b.best8 - a.best8 || a.nick.localeCompare(b.nick));
}

function gap(val, leader) {
  return val === leader ? '—' : '−' + (leader - val);
}

function groupBadge(g) {
  return `<span class="badge badge-${g.toLowerCase()}">${g}</span>`;
}

// ============================================================
// 🏆  RENDER 2026 STANDINGS

function render26() {
  const el    = document.getElementById('standings-26');
  const grid  = document.getElementById('wk-grid-26');
  document.getElementById('meta-weeks-26').textContent = WEEKS_2026.length;

  if (WEEKS_2026.length === 0) {
    el.innerHTML = `<div class="empty">
      <h3>Tímabilið hefst bráðum</h3>
      <p>Engar vikur hafa verið spilað enn.<br>Stigataflan uppfærist eftir fyrstu viku.</p>
    </div>`;
    grid.innerHTML = '<p style="padding:14px 20px;color:var(--muted);font-size:0.83rem">Engar vikur skráðar enn.</p>';
    return;
  }

  const rows = calcStandings(SCORES_2026, PLAYERS);
  const leader = rows[0]?.best8 || 0;

  let h = `<table class="standings-table"><thead><tr>
    <th>#</th><th>Leikmaður</th><th class="r">Vikur</th>
    <th class="r">Bestu 8</th><th class="r">Meðaltal</th><th class="r">Bil</th>
  </tr></thead><tbody>`;

  rows.forEach((p, i) => {
    const r = i + 1;
    h += `<tr>
      <td class="rank ${r<=3?'podium':''}">${r}</td>
      <td><a class="player-link" href="player.html?p=${encodeURIComponent(p.nick)}">${p.nick}</a>${groupBadge(p.group)}</td>
      <td class="td-r count">${p.rounds}</td>
      <td class="td-r pts">${p.best8 || '—'}</td>
      <td class="td-r">${p.avg ?? '—'}</td>
      <td class="td-r gap">${p.best8 ? gap(p.best8, leader) : '—'}</td>
    </tr>`;
  });
  h += '</tbody></table>';
  el.innerHTML = h;

  grid.innerHTML = WEEKS_2026.map(w =>
    `<button class="week-btn has-data" data-wk="${w.id}" onclick="showWk('26','${w.id}')">${w.label}</button>`
  ).join('');
}

  RESULTS_2025.forEach(r => {
    const p = PLAYERS.find(x => (x.nick25||x.nick) === r.nick || x.nick === r.nick);
    const grp = p ? groupBadge(p.group) : '';
    const linkNick = p ? p.nick : r.nick;
    h += `<tr>
      <td class="rank ${r.rank<=3?'podium':''}">${r.rank}</td>
      <td><a class="player-link" href="player.html?p=${encodeURIComponent(linkNick)}">${r.nick}</a></td>

      <td class="td-r">${r.avg.toFixed ? r.avg.toFixed(1) : r.avg}</td>
      <td class="td-r gap">${gap(r.best8, lead)}</td>

  h += '</tbody></table>';
  el.innerHTML = h;

  grid.innerHTML = WEEKS_2025.map(w =>
    `<button class="week-btn has-data" data-wk="${w.id}" onclick="showWk('25','${w.id}')">${w.label}${w.note ? ' ✈' : ''}</button>`
  ).join('');
}

// ============================================================
// 📅  WEEK DETAIL
// ============================================================
const _activeWk = { '26': null, '25': null };

function showWk(season, wkId) {
  const detailEl = document.getElementById(`wk-detail-${season}`);
  const weeks    = season === '25' ? WEEKS_2025 : WEEKS_2026;
  const scores   = season === '25' ? SCORES_2025 : SCORES_2026;

  // Toggle off
  if (_activeWk[season] === wkId) {
    _activeWk[season] = null;
    detailEl.innerHTML = '';
    document.querySelectorAll(`#wk-grid-${season} .week-btn`).forEach(b => b.classList.remove('active'));
    return;
  }

  _activeWk[season] = wkId;
  document.querySelectorAll(`#wk-grid-${season} .week-btn`).forEach(b =>
    b.classList.toggle('active', b.dataset.wk === wkId)
  );

  const week = weeks.find(w => w.id === wkId);

  // Gather results
  let results = PLAYERS.map(p => {
    const lookupNick = (season === '25' && p.nick25) ? p.nick25 : p.nick;
    const pts = (scores[lookupNick] || {})[wkId];
    return pts !== undefined ? { nick: p.nick, pts } : null;
  }).filter(Boolean).sort((a,b) => b.pts - a.pts);

  if (!results.length) {
    detailEl.innerHTML = `<div class="week-detail"><p style="color:var(--muted)">Engar niðurstöður skráðar fyrir þessa viku.</p></div>`;
    return;
  }

  let h = `<div class="week-detail">
    <div class="wk-hdr">
      <h3>${week?.label || wkId}</h3>
      <span class="wk-date">${week?.date || ''}</span>
      ${week?.note ? `<span class="wk-note">✈ ${week.note}</span>` : ''}
      <span style="margin-left:auto;color:var(--muted);font-size:0.8rem">${results.length} leikmaður</span>
    </div>
    <div class="results-grid">`;

  results.forEach((r, i) => {
    h += `<div class="result-card ${i===0?'winner':''}">
      <div>
        <div class="rc-name">${i===0?'🥇 ':''}${r.nick}</div>
        <div class="rc-pos">#${i+1}</div>
      </div>
      <div class="rc-pts">${r.pts}</div>
    </div>`;
  });

  h += '</div></div>';
  detailEl.innerHTML = h;
}

// ============================================================
// 🔀  SEASON SWITCHER
// ============================================================
function showSeason(yr) {
  document.getElementById('view-2026').style.display = yr==='2026' ? '' : 'none';
  document.getElementById('view-2025').style.display = yr==='2025' ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.textContent.includes(yr))
  );
}

// ── Init ──
render26();
render25();
</script>
